<!-- THE MASTHEAD, revision 3.

     Revision 1 read "MAARS · KSØMAN" over "Manhattan Area Amateur Radio Society · Manhattan,
     Kansas". A middle dot is not punctuation; it is what you reach for when two things have not
     been given a shape. Revision 2 gave them one — four lines, each its own element, nothing
     welded to anything — and it was honest and it was dull: a page of type with a name at the top
     of it, indistinguishable from any other club.

     Revision 3 scraps it and starts from what this club actually is. Every licensed amateur alive
     reads one picture without being taught it: the spectrum trace with a waterfall scrolling
     underneath, the display on the front of an IC-7300 and the output of a twenty-dollar RTL-SDR
     dongle. It says "radio" to somebody licensed in 1962 and to somebody licensed last month, and
     it is soft and smooth by its own nature — a continuous heat map with no hard edge in it.

     So the masthead IS that display, tuned to 147.255 MHz, the Society's own repeater, with the
     identity resting in it. The block does the whole of it: canvas, identity and the line
     underneath that says the band is a drawing rather than a receiver, because it is, and this
     site does not let a picture make a claim the words will not back.

     The navigation stays where revision 2 put it: its own quiet row under the band, not inside
     it. Seven items, all of them on this site, each 48px tall because the line box IS the hit
     target when core blockifies a navigation link. -->
