# MAARS / KS0MAN - ks0man-site demonstration stack.
#
#   docker compose up -d
#   open http://localhost:3039
#
# That is the whole quick start. There is no .env file, no copy step and no
# value to fill in first: everything the stack needs is written literally in
# this one file, so what you read here is exactly what runs.
#
# Two containers, two named volumes, no bind mounts, no host paths. The site
# installs and seeds itself on first boot; watch it happen with
# `docker compose logs -f wordpress`.
#
# Everything the site is made of - the maars-core plugin, the maars block
# theme, the seed content - lives in the image, not in a volume. Only uploads
# and the database persist. That is deliberate: this project's failure mode is
# a site that quietly stops matching its source, so the source wins on every
# boot.
name: ks0man-site

services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    # LOCAL DEVELOPMENT CREDENTIALS, written in the clear on purpose - change every password in this file before this stack is reachable from anywhere but localhost.
    environment:
      MARIADB_DATABASE: maars
      MARIADB_USER: maars
      MARIADB_PASSWORD: maars_local_dev
      # No root password to store, rotate or leak. WordPress connects as the
      # unprivileged user above, which owns the whole maars database.
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - maars_db:/var/lib/mysql
    healthcheck:
      # Ships with the mariadb image. --innodb_initialized is the difference
      # between "the port answers" and "the database will accept your query".
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  wordpress:
    image: ghcr.io/atvriders/ks0man-site:latest
    # Building locally instead of pulling: uncomment the two lines below and
    # run `docker compose up -d --build`. Nothing else changes.
    # build:
    #   context: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Change the left-hand number to publish somewhere else, and change
      # MAARS_SITE_URL below to match: WordPress is told its URL, never left
      # to guess it.
      - "3039:80"
    # LOCAL DEVELOPMENT CREDENTIALS, written in the clear on purpose - change every password in this file before this stack is reachable from anywhere but localhost.
    environment:
      # --- database (must agree with the db service above) ------------------
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: maars
      WORDPRESS_DB_USER: maars
      WORDPRESS_DB_PASSWORD: maars_local_dev
      WORDPRESS_TABLE_PREFIX: wp_
      WORDPRESS_DEBUG: "0"
      # --- site identity, read by docker/entrypoint.sh on first boot --------
      # Leave BLANK to auto-detect from the browser's own request, which is what
      # makes this work on any host and port without editing anything -
      # http://localhost:3039, http://192.0.2.10:3039, whatever. Set it only if
      # you are behind a proxy that rewrites Host, or you want it pinned.
      MAARS_SITE_URL: ""
      # Public hostnames this site is allowed to call itself, space or comma
      # separated. Loopback and LAN addresses are accepted automatically, so
      # this is only for real names.
      #
      # A public hostname is NOT auto-detected on purpose: the Host header is
      # attacker-controlled, and believing it blindly is how a site ends up
      # emitting somebody else's domain in its own password-reset links. Naming
      # the hosts here is the whole point of the allowlist.
      #
      # ks0man.org is where this deploys. ks0man.com is the 1997 site and is NOT
      # listed: it stays where it is and redirects, and this stack must never
      # answer for it.
      MAARS_ALLOWED_HOSTS: "ks0man.org www.ks0man.org ks0man.waterburp.com"
      # 1 when a reverse proxy in front of this terminates TLS, so
      # X-Forwarded-Proto is trustworthy. Behind a Cloudflare tunnel the origin
      # sees plain HTTP while the browser is on HTTPS; without this the site
      # would advertise http:// URLs to an https:// visitor and mix content.
      MAARS_TRUST_PROXY: "1"
      MAARS_SITE_TITLE: Manhattan Area Amateur Radio Society
      MAARS_TIMEZONE: America/Chicago
      # --- first-boot administrator -----------------------------------------
      # Sign in at http://localhost:3039/wp-login.php with these.
      MAARS_ADMIN_USER: maars_admin
      MAARS_ADMIN_PASSWORD: maars_local_dev
      # Left blank on purpose. This repository and this image are public, so no
      # address of any kind is committed here; the entrypoint builds a
      # throwaway no-reply address in the RFC 2606 .invalid domain, which can
      # never resolve or receive. Set your own here if you want WordPress to be
      # able to reach you - it stays on your machine.
      MAARS_ADMIN_EMAIL: ""
      MAARS_ADMIN_EMAIL_DOMAIN: maars.invalid
      # --- first-boot behaviour ---------------------------------------------
      # 1 installs WordPress but skips the demonstration content, leaving an
      # empty site to point tools/build_content.py at.
      MAARS_SKIP_SEED: "0"
      # Two-second attempts at reaching the database before first boot gives up
      # waiting and lets the failure show in the log.
      MAARS_DB_WAIT_TRIES: "60"
      # WP_HOME and WP_SITEURL come from the environment rather than the
      # database, so the URL is a property of how you started the stack and
      # cannot go stale inside a volume. Core lives in the image, so let
      # nothing in wp-admin try to rewrite it.
      # ONE LINE, AND DELIBERATELY NO DOLLAR SIGN ANYWHERE IN IT.
      # Docker Compose interpolates dollar-variables inside compose values, so PHP
      # inline here has every variable replaced with an empty string and
      # WordPress dies with a parse error on every request. The logic lives in
      # docker/site-url.php instead, where php -l and the test suite can reach
      # it. Do not inline PHP here again.
      WORDPRESS_CONFIG_EXTRA: "require_once '/usr/src/maars/site-url.php';"
    volumes:
      # Uploads only. Code and content come from the image on every boot.
      - maars_uploads:/var/www/html/wp-content/uploads
    healthcheck:
      # wp-login.php needs Apache, PHP and the database all three, so this is
      # a real readiness signal rather than a liveness fig leaf. start_period
      # covers first-boot install and seeding.
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost/wp-login.php || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 150s

volumes:
  maars_db:
  maars_uploads:
